<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ReinAgent</title>
    <script>
      try {
        const t = localStorage.getItem("reinagent-theme") || "dark";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
    <style>
      html,
      body,
      #root {
        margin: 0;
        width: 100%;
        height: 100%;
      }

      #root {
        opacity: 0;
        transition: opacity 0.2s ease;
      }

      body.startup-ready #root {
        opacity: 1;
      }

      #loading {
        position: fixed;
        inset: 0;
        z-index: 999999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #12141a;
        transition: opacity 0.24s ease, visibility 0.24s ease;
      }

      html[data-theme="light"] #loading {
        background: #f8fafc;
      }

      body.startup-ready #loading {
        pointer-events: none;
        opacity: 0;
        visibility: hidden;
      }

      .startup-logo-shell {
        position: relative;
        display: flex;
        width: 88px;
        height: 88px;
        align-items: center;
        justify-content: center;
        border-radius: 22px;
        background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
        box-shadow:
          0 16px 36px -6px rgba(37, 99, 235, 0.45),
          0 6px 16px -3px rgba(0, 0, 0, 0.25);
        transform: scale(0.72);
        opacity: 0;
        animation: startup-logo-pop 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        transform-origin: center;
      }

      .startup-logo-shell::before {
        position: absolute;
        inset: 0;
        pointer-events: none;
        content: "";
        border: 1.5px solid rgba(255, 255, 255, 0.25);
        border-radius: inherit;
      }

      .startup-logo-text {
        color: #ffffff;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 48px;
        font-weight: 800;
        line-height: 1;
        user-select: none;
        letter-spacing: -0.5px;
      }

      @keyframes startup-logo-pop {
        0% {
          opacity: 0;
          transform: scale(0.72);
        }
        50% {
          opacity: 1;
          transform: scale(1.04);
        }
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <div id="loading" role="status" aria-busy="true" aria-label="Loading...">
      <div class="startup-logo-shell">
        <span class="startup-logo-text">R</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
