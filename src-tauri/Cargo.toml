[package]
name = "ReinAgent"
version = "0.1.1"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "reinagent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "unstable"] }
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
tauri-plugin-notification = "2"
# 出站 HTTP（无 CORS 概念）：模型列表/对话流/标题生成统一经插件 fetch 走 Rust reqwest，
# 顺带让「联网代理」设置对所有出站请求生效（前端原生 fetch 不吃代理且受 CORS 约束）
tauri-plugin-http = "2"
# LLM 本地流式反代（llm_proxy.rs）：bytes_stream 流式回传 + 按kv代理出网。
# 版本与 tauri-plugin-http 的 reqwest 对齐（0.13），feature 并集共享同一编译单元
reqwest = { version = "0.13", default-features = false, features = ["stream", "json"] }
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = { version = "1", features = ["raw_value"] }
portable-pty = "0.8"
rfd = "0.15"
base64 = "0.22"
sha2 = "0.10"
dunce = "1.0"
chrono = "0.4"
ureq = { version = "3", features = ["json"] }
html2text = "0.14"
uuid = { version = "1", features = ["v4"] }
bytes = "1"
regex = "1"
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3.32"
hmac = "0.12.1"
sha1 = "0.10.6"
flate2 = "1.1.8"
urlencoding = "2.1.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
tempfile = "3"
dirs = "6"
toml = "0.9"
tokio = { version = "1", features = ["rt", "time"] }
axum = { version = "0.8.9", features = ["ws"] }

# 系统通知直发（notify_send）：tauri-plugin-notification 在 Windows dev 构建
# （exe 位于 target/debug|release）不设置 AUMID，Toast 被系统静默丢弃
[target.'cfg(target_os = "windows")'.dependencies]
tauri-winrt-notification = "0.8"
webview2-com = "0.39"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
] }
windows-core = "0.62"
tauri-runtime = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
# crt-static 经 .cargo/config.toml 的 rustflags 设置（cargo 配置不支持在 TOML 里写该参数）
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Linux 专属：内嵌浏览器的 WebKitGTK 读通道（run_javascript 取值）与原生截图（snapshot→PNG）
[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4"
webkit2gtk = { version = "2", features = ["v2_40"] }
cairo-rs = { version = "0.18", features = ["png"] }
javascriptcore = { version = "1", package = "javascriptcore-rs" }
gtk = { version = "0.18", package = "gtk" }

# 单文件 exe：静态链接 CRT（下面主 [profile.release] 中），产物不依赖目标机的 VC++ 运行库
