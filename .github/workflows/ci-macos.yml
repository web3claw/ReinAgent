name: Test macOS Build

on:
  push:
    branches:
      - feature/macos-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build-macos:
    name: macOS Compile Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Frontend Build
        run: bun run build

      - name: Rust Check (macOS Target)
        run: cargo check --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin

      - name: Tauri Build Test (without bundle)
        run: bunx tauri build --target aarch64-apple-darwin --no-bundle
