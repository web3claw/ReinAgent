name: Release

# 推 v* tag（或手动触发）→ 四平台构建 → 汇总产物 + SHA256 → 生成 latest.json
# → 发布到 GitHub Releases。
#
# 分发形态（不用 tauri-plugin-updater，自更新逻辑见 src-tauri/src/self_update.rs）：
# - Windows / Linux：`--no-bundle` 出的**裸二进制**（免安装，双击/直接运行）
# - macOS：`.app` + `.dmg`，并将 `.app` 压为 zip 供自更新
#
# latest.json 格式（自更新模块消费）：
#   { version, notes, pub_date, assets: { 文件名: { url, size, sha256 } } }
#
# 无需任何签名 secret（校验仅 SHA-256，与 magpie 一致）。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（如 v0.1.3）；留空则用 tauri.conf.json 的 version"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            os_name: darwin
            arch: arm64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            os_name: windows
            arch: amd64
          # ARM64 平台暂缓编译（windows-11-arm 与 ubuntu-22.04-arm，加快 CI 构建）
          # - platform: windows-11-arm
          #   target: aarch64-pc-windows-msvc
          #   os_name: windows
          #   arch: arm64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            os_name: linux
            arch: amd64
          # - platform: ubuntu-22.04-arm
          #   target: aarch64-unknown-linux-gnu
          #   os_name: linux
          #   arch: arm64

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libgtk-3-dev file

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # ---------- 构建 ----------

      # macOS：出 app + dmg（dmg 给人下载），再把 .app 打包成 zip 供自更新。
      - name: Build (macOS)
        if: matrix.os_name == 'darwin'
        run: bunx tauri build --target ${{ matrix.target }} --bundles app,dmg

      - name: Package macOS artifacts
        if: matrix.os_name == 'darwin'
        shell: bash
        run: |
          set -euo pipefail
          BASE="src-tauri/target/${{ matrix.target }}/release/bundle"
          APP="$BASE/macos/ReinAgent.app"
          mkdir -p artifacts
          # 自更新用 zip（--keepParent 保留顶层 ReinAgent.app，供解包后定位）
          ditto -c -k --keepParent "$APP" "artifacts/ReinAgent-${{ matrix.os_name }}-${{ matrix.arch }}.zip"
          # 给人下载的未签名 dmg
          cp "$BASE"/dmg/*.dmg "artifacts/ReinAgent-${{ matrix.os_name }}-${{ matrix.arch }}.dmg"
          ls -la artifacts

      # Windows / Linux：裸二进制（--no-bundle）
      - name: Build (Windows / Linux)
        if: matrix.os_name != 'darwin'
        shell: bash
        run: bunx tauri build --target ${{ matrix.target }} --no-bundle

      # 注意：产物放 artifacts/ 而非 dist/ —— `tauri build` 会先跑 `bun run build`，
      # 前端产物输出到仓库根的 dist/（frontendDist = ../dist），若同目录会一并被上传。
      - name: Package Windows / Linux artifacts
        if: matrix.os_name != 'darwin'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          if [ "${{ matrix.os_name }}" = "windows" ]; then
            SRC="src-tauri/target/${{ matrix.target }}/release/ReinAgent.exe"
            cp "$SRC" "artifacts/ReinAgent-windows-${{ matrix.arch }}.exe"
          else
            SRC="src-tauri/target/${{ matrix.target }}/release/ReinAgent"
            cp "$SRC" "artifacts/ReinAgent-linux-${{ matrix.arch }}"
            chmod +x "artifacts/ReinAgent-linux-${{ matrix.arch }}"
          fi
          ls -la artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os_name }}-${{ matrix.arch }}
          path: artifacts/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      # 只取构建产物（各 job 上传的 artifact 内容，不含前端 dist/）
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Resolve version and tag
        id: meta
        run: |
          set -euo pipefail
          VERSION=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            if [ "${GITHUB_REF_TYPE}" = "tag" ]; then TAG="${GITHUB_REF_NAME}"; else TAG="v${VERSION}"; fi
          fi
          # 若手填 tag 带 v 前缀，版本号取其去掉 v 的部分
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          ls -la artifacts

      - name: Generate latest.json
        run: |
          set -euo pipefail
          python3 - "${{ steps.meta.outputs.version }}" "${{ steps.meta.outputs.tag }}" > latest.json <<'PY'
          import hashlib, json, os, sys, datetime
          version, tag = sys.argv[1], sys.argv[2]
          repo = os.environ["GITHUB_REPOSITORY"]
          base = f"https://github.com/{repo}/releases/download/{tag}"
          assets = {}
          for name in sorted(os.listdir("artifacts")):
              path = os.path.join("artifacts", name)
              if not os.path.isfile(path):
                  continue
              data = open(path, "rb").read()
              assets[name] = {
                  "url": f"{base}/{name}",
                  "size": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
              }
          doc = {
              "version": version,
              "notes": f"ReinAgent {tag}",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "assets": assets,
          }
          print(json.dumps(doc, indent=2, ensure_ascii=False))
          PY
          echo "=== latest.json ==="
          cat latest.json

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "ReinAgent ${{ steps.meta.outputs.tag }}"
          draft: false
          prerelease: false
          body: |
            #### 🖥️ SSH 远程项目（SSH Projects）
            工作区直填 `ssh://[user@]host[:port]/path`——Agent 的文件工具、命令执行与终端全部作用于远程机器。
            - **连接管理**：侧栏「项目 ▸ +」→「SSH 连接…」表单（测试连接一键探活），支持从 `~/.ssh/config` 导入。
            - **三态认证**：密钥 / agent / 密码（SSH_ASKPASS 注入，仅 Linux / macOS；Windows 如实提示）；密码存本地 0600 认证文件。
            - **架构**：系统 ssh 客户端 + shell 模拟文件 API（非 sshfs、零 SSH 库依赖）；keepalive 5s×3 半死连接自检；60s 命令超时可读报错；沿用应用出网代理。
            - **远端能力**：文件八件套 / 命令执行 / 终端即远端 shell / Git 只读查看 / 看板与定时任务绑定 SSH 工作区。
            - **v1 边界（如实提示）**：不支持检查点回退、worktree、PR 面板、Wiki 与知识库索引。

            #### 🧩 Wiki 项目文档生成（Knowledge Wiki）
            侧栏「Wiki 文档」：对任意工作区一键生成整套 DeepWiki 风格文档（总览 + 3-6 章 / 8-16 页）。
            - **三段链路**：采集（README+docs 48KB+源码树+采样）→ 规划（三层容错解析+原文重试+模块兜底）→ 并行成页（并发 4+截断续写 ≤4 轮）→ 总览页强制 mermaid 架构图。
            - **知识投影**：页面自动注册为知识库源参与 RAG 检索（schema v2 迁移）；每页可一键提取知识图谱；单页可重生成。
            - **队列语义**：wiki_jobs 先落库再执行、进度/阶段/页数计数、超时陈旧回收（ROADMAP ⓪ 落地形态）。
            - **可视化**：章节分组文档树 + mermaid 实时渲染查看器；Wiki 模型可在场景默认模型单独指定。

            #### 📦 v2 收口四件（v0.2.14 各功能的 v2 缺口一批清掉）
            - **通知收件箱**：看板失败/阻塞与定时任务失败聚合进侧栏铃铛（同键计数+1/回未读），点击跳转对应页面。
            - **记忆会话作用域**：session 记忆按任务隔离（workdir_hash=hash(taskId) 免 schema 手术），语义检索三路并集（global ∪ 当前任务 ∪ project）。
            - **笔记 v2**：Agent 新增 list_note_tags / set_note_tags 工具；版本对照升级为词级红绿 diff。
            - **压缩管线 v2**：数字归一化 + 关键行自适应抽取（仅在会被盲截时执行）+ 停用词（默认关）三节点。

            #### 🐛 修复与沉淀
            - 设置页白屏修复（hooks 位置）与 knowledge_search 双重加锁死锁修复（v0.2.14 后追加）。
            - 全量验证：Rust 329 单测 + 前端 52 单测全绿，关键路径均做过破坏性变异验证；SSH 全链路经真实代理 + 真实远程机实测（含断链场景）。

          files: |
            artifacts/*
            latest.json
