name: Release

# 推 v* tag（或手动触发）→ 四平台构建 → 汇总产物 + SHA256 → 生成 latest.json
# → 发布到 GitHub Releases。
#
# 分发形态（不用 tauri-plugin-updater，自更新逻辑见 src-tauri/src/self_update.rs）：
# - Windows / Linux：`--no-bundle` 出的**裸二进制**（免安装，双击/直接运行）
#
# latest.json 格式（自更新模块消费）：
#   { version, notes, pub_date, assets: { 文件名: { url, size, sha256 } } }
#
# 无需任何签名 secret（校验仅 SHA-256，与 magpie 一致）。
#
# ⚠ macOS 暂未纳入（2026-10-08）：项目从未在 macOS 编译过，存在既有移植缺口——
#   browser.rs 的 webkit2gtk/javascriptcore 段未用 cfg(target_os="linux") 隔离、
#   stt/mod.rs 的 macOS 分支引用不存在的 crate::services 且缺 objc2/block2/
#   objc2-av-foundation 依赖。补齐后再启用下面被注释的 macOS 矩阵项与构建步骤。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（如 v0.1.3）；留空则用 tauri.conf.json 的 version"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 暂未启用（见文件头说明：既有移植缺口未补齐）
          # - platform: macos-latest
          #   target: aarch64-apple-darwin
          #   os_name: darwin
          #   arch: arm64
          # - platform: macos-15-intel
          #   target: x86_64-apple-darwin
          #   os_name: darwin
          #   arch: amd64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            os_name: windows
            arch: amd64
          # ARM64 平台暂缓编译（windows-11-arm 与 ubuntu-22.04-arm，加快 CI 构建）
          # - platform: windows-11-arm
          #   target: aarch64-pc-windows-msvc
          #   os_name: windows
          #   arch: arm64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            os_name: linux
            arch: amd64
          # - platform: ubuntu-22.04-arm
          #   target: aarch64-unknown-linux-gnu
          #   os_name: linux
          #   arch: arm64

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libgtk-3-dev file

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # ---------- 构建 ----------

      # macOS：出 app + dmg（dmg 给人下载），再把 .app 打包成 zip 供自更新。
      # 目前矩阵中无 darwin 项，此步不会执行；补齐 macOS 移植后启用矩阵即可复用。
      - name: Build (macOS)
        if: matrix.os_name == 'darwin'
        run: bunx tauri build --target ${{ matrix.target }} --bundles app,dmg

      - name: Package macOS artifacts
        if: matrix.os_name == 'darwin'
        shell: bash
        run: |
          set -euo pipefail
          BASE="src-tauri/target/${{ matrix.target }}/release/bundle"
          APP="$BASE/macos/ReinAgent.app"
          mkdir -p artifacts
          # 自更新用 zip（--keepParent 保留顶层 ReinAgent.app，供解包后定位）
          ditto -c -k --keepParent "$APP" "artifacts/ReinAgent-${{ matrix.os_name }}-${{ matrix.arch }}.zip"
          # 给人下载的未签名 dmg
          cp "$BASE"/dmg/*.dmg "artifacts/ReinAgent-${{ matrix.os_name }}-${{ matrix.arch }}.dmg"
          ls -la artifacts

      # Windows / Linux：裸二进制（--no-bundle）
      - name: Build (Windows / Linux)
        if: matrix.os_name != 'darwin'
        shell: bash
        run: bunx tauri build --target ${{ matrix.target }} --no-bundle

      # 注意：产物放 artifacts/ 而非 dist/ —— `tauri build` 会先跑 `bun run build`，
      # 前端产物输出到仓库根的 dist/（frontendDist = ../dist），若同目录会一并被上传。
      - name: Package Windows / Linux artifacts
        if: matrix.os_name != 'darwin'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          if [ "${{ matrix.os_name }}" = "windows" ]; then
            SRC="src-tauri/target/${{ matrix.target }}/release/ReinAgent.exe"
            cp "$SRC" "artifacts/ReinAgent-windows-${{ matrix.arch }}.exe"
          else
            SRC="src-tauri/target/${{ matrix.target }}/release/ReinAgent"
            cp "$SRC" "artifacts/ReinAgent-linux-${{ matrix.arch }}"
            chmod +x "artifacts/ReinAgent-linux-${{ matrix.arch }}"
          fi
          ls -la artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os_name }}-${{ matrix.arch }}
          path: artifacts/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      # 只取构建产物（各 job 上传的 artifact 内容，不含前端 dist/）
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Resolve version and tag
        id: meta
        run: |
          set -euo pipefail
          VERSION=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            if [ "${GITHUB_REF_TYPE}" = "tag" ]; then TAG="${GITHUB_REF_NAME}"; else TAG="v${VERSION}"; fi
          fi
          # 若手填 tag 带 v 前缀，版本号取其去掉 v 的部分
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          ls -la artifacts

      - name: Generate latest.json
        run: |
          set -euo pipefail
          python3 - "${{ steps.meta.outputs.version }}" "${{ steps.meta.outputs.tag }}" > latest.json <<'PY'
          import hashlib, json, os, sys, datetime
          version, tag = sys.argv[1], sys.argv[2]
          repo = os.environ["GITHUB_REPOSITORY"]
          base = f"https://github.com/{repo}/releases/download/{tag}"
          assets = {}
          for name in sorted(os.listdir("artifacts")):
              path = os.path.join("artifacts", name)
              if not os.path.isfile(path):
                  continue
              data = open(path, "rb").read()
              assets[name] = {
                  "url": f"{base}/{name}",
                  "size": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
              }
          doc = {
              "version": version,
              "notes": f"ReinAgent {tag}",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "assets": assets,
          }
          print(json.dumps(doc, indent=2, ensure_ascii=False))
          PY
          echo "=== latest.json ==="
          cat latest.json

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "ReinAgent ${{ steps.meta.outputs.tag }}"
          draft: false
          prerelease: false
          body: |
            ReinAgent ${{ steps.meta.outputs.tag }}

            Windows / Linux 为免安装裸二进制（win: .exe，linux: 无扩展名）。
            已安装的 ReinAgent 启动时会自动检查更新。
          files: |
            artifacts/*
            latest.json
