name: Release

# 推 v* tag（或手动触发）→ 四平台构建 → 汇总产物 + SHA256 → 生成 latest.json
# → 发布到 GitHub Releases。
#
# 分发形态（不用 tauri-plugin-updater，自更新逻辑见 src-tauri/src/self_update.rs）：
# - Windows / Linux：`--no-bundle` 出的**裸二进制**（免安装，双击/直接运行）
# - macOS：`.app` + `.dmg`，并将 `.app` 压为 zip 供自更新
#
# latest.json 格式（自更新模块消费）：
#   { version, notes, pub_date, assets: { 文件名: { url, size, sha256 } } }
#
# 无需任何签名 secret（校验仅 SHA-256，与 magpie 一致）。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（如 v0.1.3）；留空则用 tauri.conf.json 的 version"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            os_name: darwin
            arch: arm64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            os_name: windows
            arch: amd64
          # ARM64 平台暂缓编译（windows-11-arm 与 ubuntu-22.04-arm，加快 CI 构建）
          # - platform: windows-11-arm
          #   target: aarch64-pc-windows-msvc
          #   os_name: windows
          #   arch: arm64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            os_name: linux
            arch: amd64
          # - platform: ubuntu-22.04-arm
          #   target: aarch64-unknown-linux-gnu
          #   os_name: linux
          #   arch: arm64

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libgtk-3-dev file

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # ---------- 构建 ----------

      # macOS：出 app + dmg（dmg 给人下载），再把 .app 打包成 zip 供自更新。
      - name: Build (macOS)
        if: matrix.os_name == 'darwin'
        run: bunx tauri build --target ${{ matrix.target }} --bundles app,dmg

      - name: Package macOS artifacts
        if: matrix.os_name == 'darwin'
        shell: bash
        run: |
          set -euo pipefail
          BASE="src-tauri/target/${{ matrix.target }}/release/bundle"
          APP="$BASE/macos/ReinAgent.app"
          mkdir -p artifacts
          # 自更新用 zip（--keepParent 保留顶层 ReinAgent.app，供解包后定位）
          ditto -c -k --keepParent "$APP" "artifacts/ReinAgent-${{ matrix.os_name }}-${{ matrix.arch }}.zip"
          # 给人下载的未签名 dmg
          cp "$BASE"/dmg/*.dmg "artifacts/ReinAgent-${{ matrix.os_name }}-${{ matrix.arch }}.dmg"
          ls -la artifacts

      # Windows / Linux：裸二进制（--no-bundle）
      - name: Build (Windows / Linux)
        if: matrix.os_name != 'darwin'
        shell: bash
        run: bunx tauri build --target ${{ matrix.target }} --no-bundle

      # 注意：产物放 artifacts/ 而非 dist/ —— `tauri build` 会先跑 `bun run build`，
      # 前端产物输出到仓库根的 dist/（frontendDist = ../dist），若同目录会一并被上传。
      - name: Package Windows / Linux artifacts
        if: matrix.os_name != 'darwin'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          if [ "${{ matrix.os_name }}" = "windows" ]; then
            SRC="src-tauri/target/${{ matrix.target }}/release/ReinAgent.exe"
            cp "$SRC" "artifacts/ReinAgent-windows-${{ matrix.arch }}.exe"
          else
            SRC="src-tauri/target/${{ matrix.target }}/release/ReinAgent"
            cp "$SRC" "artifacts/ReinAgent-linux-${{ matrix.arch }}"
            chmod +x "artifacts/ReinAgent-linux-${{ matrix.arch }}"
          fi
          ls -la artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os_name }}-${{ matrix.arch }}
          path: artifacts/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      # 只取构建产物（各 job 上传的 artifact 内容，不含前端 dist/）
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Resolve version and tag
        id: meta
        run: |
          set -euo pipefail
          VERSION=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            if [ "${GITHUB_REF_TYPE}" = "tag" ]; then TAG="${GITHUB_REF_NAME}"; else TAG="v${VERSION}"; fi
          fi
          # 若手填 tag 带 v 前缀，版本号取其去掉 v 的部分
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          ls -la artifacts

      - name: Generate latest.json
        run: |
          set -euo pipefail
          python3 - "${{ steps.meta.outputs.version }}" "${{ steps.meta.outputs.tag }}" > latest.json <<'PY'
          import hashlib, json, os, sys, datetime
          version, tag = sys.argv[1], sys.argv[2]
          repo = os.environ["GITHUB_REPOSITORY"]
          base = f"https://github.com/{repo}/releases/download/{tag}"
          assets = {}
          for name in sorted(os.listdir("artifacts")):
              path = os.path.join("artifacts", name)
              if not os.path.isfile(path):
                  continue
              data = open(path, "rb").read()
              assets[name] = {
                  "url": f"{base}/{name}",
                  "size": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
              }
          doc = {
              "version": version,
              "notes": f"ReinAgent {tag}",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "assets": assets,
          }
          print(json.dumps(doc, indent=2, ensure_ascii=False))
          PY
          echo "=== latest.json ==="
          cat latest.json

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "ReinAgent ${{ steps.meta.outputs.tag }}"
          draft: false
          prerelease: false
          body: |
            #### 🔗 链接智能收藏与文章归档管道（Link Clipping & Knowledge Archiving）
            - **IM 三平台 + 桌面端统一支持**：用户在 QQ / 微信 / 飞书或桌面端直接发送文章链接，ReinBot 自动感知并完成网页正文抓取、关键要点提炼与结构化归档；
            - **确定性预抓取与防编造（Data Integrity）**：代码层前置识别链接并执行真实抓取，将真实文章正文注入上下文，杜绝大模型跳过工具凭记忆虚构内容；抓取失败直接如实报错；
            - **Rust 极速抓取 + 内置浏览器渲染降级**：
              - 基于 dom_query 的 HTTP 直抓（常规站点 200~300ms 完成，智能识别正文容器）；
              - SPA / JS 动态渲染站点（掘金、知乎等）自动降级至内置浏览器真实渲染抓取；
              - 自动规约文章标题（提取 h1 与语义标点截断，防止文件名超长），支持代理白名单直连；
            - **本地知识库自动归档**：落盘至笔记「收藏夹」物理目录（带 source_url、site、channel 等 frontmatter 元数据与三段式精炼总结），并自动触发本地知识库 Embedding 索引；

            #### 🛡️ 运行状态可视化与健壮性护栏
            - **ReinBot 工具运行卡**：消息气泡内实时展示工具运行状态卡（🔄 抓取中 / ✅ 已抓取正文 / 🔴 失败原因）；
            - **MCP 枚举 8s 超时护栏**：防止不可达的外部 MCP 服务长时间挂起阻塞整个模型思考回路；
            - **30s 思考超时提示**：模型长达 30 秒无任何文本产出时展示超时警告与停止按钮，告别无限等待。

            #### 📚 文档与数据诚实铁律
            - **数据诚实铁律写入 AGENTS.md**：严禁向用户配置写入假凭据/假数据，关键路径必须代码层强制预抓取；
            - **官网与文档全套同步**：更新 README、官网 HTML 及 PROJECT_CONTEXT.md。

            #### 🧪 验证
            - 前端 768 项测试全部通过（含 clipFormat 6 项单测）；
            - Rust 后端 cargo check 0 错误通过；
            - 真实 E2E：桌面端及飞书真实链接抓取、总结、落盘归档全链路跑通。

          files: |
            artifacts/*
            latest.json
