name: Release

# 推 v* tag（或手动触发）→ 四平台构建 → 汇总产物 + SHA256 → 生成 latest.json
# → 发布到 GitHub Releases。
#
# 分发形态（不用 tauri-plugin-updater，自更新逻辑见 src-tauri/src/self_update.rs）：
# - Windows / Linux：`--no-bundle` 出的**裸二进制**（免安装，双击/直接运行）
# - macOS：`.app` + `.dmg`，并将 `.app` 压为 zip 供自更新
#
# latest.json 格式（自更新模块消费）：
#   { version, notes, pub_date, assets: { 文件名: { url, size, sha256 } } }
#
# 无需任何签名 secret（校验仅 SHA-256，与 magpie 一致）。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（如 v0.1.3）；留空则用 tauri.conf.json 的 version"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            os_name: darwin
            arch: arm64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            os_name: windows
            arch: amd64
          # ARM64 平台暂缓编译（windows-11-arm 与 ubuntu-22.04-arm，加快 CI 构建）
          # - platform: windows-11-arm
          #   target: aarch64-pc-windows-msvc
          #   os_name: windows
          #   arch: arm64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            os_name: linux
            arch: amd64
          # - platform: ubuntu-22.04-arm
          #   target: aarch64-unknown-linux-gnu
          #   os_name: linux
          #   arch: arm64

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libgtk-3-dev file

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # ---------- 构建 ----------

      # macOS：出 app + dmg（dmg 给人下载），再把 .app 打包成 zip 供自更新。
      - name: Build (macOS)
        if: matrix.os_name == 'darwin'
        run: bunx tauri build --target ${{ matrix.target }} --bundles app,dmg

      - name: Package macOS artifacts
        if: matrix.os_name == 'darwin'
        shell: bash
        run: |
          set -euo pipefail
          BASE="src-tauri/target/${{ matrix.target }}/release/bundle"
          APP="$BASE/macos/ReinAgent.app"
          mkdir -p artifacts
          # 自更新用 zip（--keepParent 保留顶层 ReinAgent.app，供解包后定位）
          ditto -c -k --keepParent "$APP" "artifacts/ReinAgent-${{ matrix.os_name }}-${{ matrix.arch }}.zip"
          # 给人下载的未签名 dmg
          cp "$BASE"/dmg/*.dmg "artifacts/ReinAgent-${{ matrix.os_name }}-${{ matrix.arch }}.dmg"
          ls -la artifacts

      # Windows / Linux：裸二进制（--no-bundle）
      - name: Build (Windows / Linux)
        if: matrix.os_name != 'darwin'
        shell: bash
        run: bunx tauri build --target ${{ matrix.target }} --no-bundle

      # 注意：产物放 artifacts/ 而非 dist/ —— `tauri build` 会先跑 `bun run build`，
      # 前端产物输出到仓库根的 dist/（frontendDist = ../dist），若同目录会一并被上传。
      - name: Package Windows / Linux artifacts
        if: matrix.os_name != 'darwin'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          if [ "${{ matrix.os_name }}" = "windows" ]; then
            SRC="src-tauri/target/${{ matrix.target }}/release/ReinAgent.exe"
            cp "$SRC" "artifacts/ReinAgent-windows-${{ matrix.arch }}.exe"
          else
            SRC="src-tauri/target/${{ matrix.target }}/release/ReinAgent"
            cp "$SRC" "artifacts/ReinAgent-linux-${{ matrix.arch }}"
            chmod +x "artifacts/ReinAgent-linux-${{ matrix.arch }}"
          fi
          ls -la artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os_name }}-${{ matrix.arch }}
          path: artifacts/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      # 只取构建产物（各 job 上传的 artifact 内容，不含前端 dist/）
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Resolve version and tag
        id: meta
        run: |
          set -euo pipefail
          VERSION=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            if [ "${GITHUB_REF_TYPE}" = "tag" ]; then TAG="${GITHUB_REF_NAME}"; else TAG="v${VERSION}"; fi
          fi
          # 若手填 tag 带 v 前缀，版本号取其去掉 v 的部分
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          ls -la artifacts

      - name: Generate latest.json
        run: |
          set -euo pipefail
          python3 - "${{ steps.meta.outputs.version }}" "${{ steps.meta.outputs.tag }}" > latest.json <<'PY'
          import hashlib, json, os, sys, datetime
          version, tag = sys.argv[1], sys.argv[2]
          repo = os.environ["GITHUB_REPOSITORY"]
          base = f"https://github.com/{repo}/releases/download/{tag}"
          assets = {}
          for name in sorted(os.listdir("artifacts")):
              path = os.path.join("artifacts", name)
              if not os.path.isfile(path):
                  continue
              data = open(path, "rb").read()
              assets[name] = {
                  "url": f"{base}/{name}",
                  "size": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
              }
          doc = {
              "version": version,
              "notes": f"ReinAgent {tag}",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "assets": assets,
          }
          print(json.dumps(doc, indent=2, ensure_ascii=False))
          PY
          echo "=== latest.json ==="
          cat latest.json

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "ReinAgent ${{ steps.meta.outputs.tag }}"
          draft: false
          prerelease: false
          body: |
            ### 🚀 ReinAgent ${{ steps.meta.outputs.tag }} 更新日志

            #### 🔀 PR / MR 评审闭环（Pull Request Panel）
            Git 面板底部新增 PR 区块，按远端地址自动选择 `gh`（GitHub）/ `glab`（GitLab）。
            - **状态一屏可见**：PR 编号 / 标题 / 状态 / 草稿标记、`+N −N` 变更量、合并门禁、审查结论、逐项 CI 检查（分色，可点开日志）。
            - **动作直达**：转正式 / 转草稿 / 合并（合并提交 · Squash · Rebase，可删分支）/ 关闭 / 重开；门禁未过或要求修改时合并按钮禁用并说明原因。
            - **创建 PR**：标题 / 描述 / 目标分支（默认解析 origin/HEAD → main → master）/ 草稿；描述经 stdin 传递规避转义问题。
            - **交给 Agent 修**：一键聚合失败与进行中的 CI、行内审查意见、失败日志摘录（≤2 条）为结构化指令，**预填输入框**（不自动发送）。
            - CLI 未安装 / 未登录 / 远端非 GitHub·GitLab 时如实提示安装命令与错误原文。

            #### 🧩 场景默认模型（Scenario Default Models）
            设置 ▸ 通用新增「场景默认模型」：聊天默认 / 知识库 Embedding / 记忆整理 / 笔记 AI / 图谱抽取分别指定。
            - 读写各场景原有配置项（**零迁移**），与知识库页、记忆页始终是同一份数据。
            - 留空即跟随聊天默认并显示当前实际生效模型；绑定失效（服务商或模型被删 / 停用）自动回退聊天默认并以警示色标注具体原因。
            - 顺带修复：笔记 AI 的模型选择此前是组件本地态（切页即失忆），现已持久化。

            #### 📊 用量来源维度（Usage by Source）
            全部模型调用按来源记账，新增三个视图。
            - **来源打标**：聊天 / 看板任务 / 定时任务（任务创建即打标）/ 子代理 / 笔记 AI / 提示词增强 / 提交信息 / 记忆整理 / 图谱抽取 / 标题生成 / 知识库向量。
            - **新增视图**：来源环形分布、来源 × 模型堆叠条、近 7 天 7×24 小时热力图。
            - **口径**：total = 输入 + 输出（缓存读写为独立分项）；响应未返回 usage 的调用不记账，绝不编造数值。
            - 历史数据自动回填并修正来源标记（幂等）。

            #### 🕸️ 知识图谱与检索增强（Knowledge Graph）
            实体—关系网络既能可视化浏览，也能反向增强语义检索。
            - **抽取**：知识库设置页对笔记逐篇或批量提取（实体 5 类 / 关系 5 类，别名自动归一，同名实体全局去重、关系三元组唯一）。
            - **可视化**：侧栏「知识图谱」Canvas 力导向图（零依赖手写仿真）——按类型分色、半径随关系数、拖拽 / 滚轮缩放 / 点击详情 / 名称搜索 / 类型筛选。
            - **人工校正**：删除实体与关系、合并重复实体（关系自动改挂，自环与重复自动清理）。
            - **检索 1 跳增强**：语义命中后按关系扩展相邻实体关联的其他笔记一并返回（标注图谱扩展、排在语义命中之后），无图谱数据不影响原链路。

            #### 🐛 修复
            - 设置页白屏：prefill 事件监听的 `useEffect` 误置于设置页早退 return 之后，打开设置页 hooks 数量骤减导致 React 卸载整树；已移入 hooks 声明区。
            - `knowledge_search` 图谱扩展二次 lock std Mutex 造成的死锁。

            #### 🧪 验证
            - Rust 313 单测全绿（含 PR 解析 / 图谱去重与 1 跳扩展 / 用量来源聚合，关键路径均做过破坏性变异验证）。
            - 前端 13 项纯函数单测全绿，`tsc` 零错误。
            - PR 面板在本仓库做过真实链路全动作实测（draft 创建 → 转正式 → 转草稿 → 关闭 → 重开 → Squash 合并并删分支）。

            ---
            📦 **下载与运行说明**：
            - **macOS**：下载 `.dmg` 文件打开并将 ReinAgent 拖拽入应用程序目录（支持 Apple Silicon M 系列芯片；首次运行若提示未签名，请在「系统设置 → 隐私与安全性」中点击允许打开）。
            - **Windows / Linux**：免安装裸二进制（Windows: `.exe`，Linux: 直接下载即可运行）。
            - 已安装的 ReinAgent 在启动时会自动检测并更新至最新版本。
          files: |
            artifacts/*
            latest.json
